AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Project 3 - Serverless Orders Application

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    Tags:
      Project: project3-serverless
  Api:
    OpenApiVersion: '3.0.1'

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: project3-serverless

  # NEW: the REST API
  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: project3-orders-api
      StageName: prod
      Tags:
        Project: project3-serverless

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: project3-create-order
      Description: Saves a new order to the Orders table
      CodeUri: src/create-order/
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable
      # NEW: POST /orders -> this function
      Events:
        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path: /orders
            Method: post

Outputs:
  OrdersTableName:
    Value: !Ref OrdersTable
  OrdersTableArn:
    Value: !GetAtt OrdersTable.Arn
  CreateOrderFunctionArn:
    Value: !GetAtt CreateOrderFunction.Arn
  CreateOrderFunctionRoleArn:
    Value: !GetAtt CreateOrderFunctionRole.Arn
  OrdersApiUrl:
    Description: POST orders to this URL
    Value: !Join ["", ["https://", !Ref OrdersApi, ".execute-api.", !Ref "AWS::Region", ".amazonaws.com/prod/orders"]]
