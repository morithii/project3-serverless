AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Project 3 - Serverless Orders Application

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    Tags:
      Project: project3-serverless
  Api:
    OpenApiVersion: '3.0.1'

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: project3-serverless

  OrdersUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: project3-orders-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: project3-serverless

  OrdersUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: project3-orders-client
      UserPoolId: !Ref OrdersUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes

  # NEW: role API Gateway assumes to read from DynamoDB (Query only, this table only)
  ApiGatewayDynamoDBReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: QueryOrdersTable
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt OrdersTable.Arn
      Tags:
        - Key: Project
          Value: project3-serverless

  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: project3-orders-api
      StageName: prod
      # Explicitly off: removing the property alone leaves an existing cache running
      CacheClusterEnabled: false
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt OrdersUserPool.Arn
      # NEW: OpenAPI definition holding the direct DynamoDB route.
      # SAM still adds POST /orders (from the function's Events) into this.
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: project3-orders-api
          version: '1.0'
        paths:
          /orders/{orderId}:
            get:
              summary: Get an order directly from DynamoDB (no Lambda)
              parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                    type: string
              security:
                - CognitoAuthorizer: []
              responses:
                '200':
                  description: The order
                '404':
                  description: Order not found
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Join ["", ["arn:aws:apigateway:", !Ref "AWS::Region", ":dynamodb:action/Query"]]
                credentials: !GetAtt ApiGatewayDynamoDBReadRole.Arn
                passthroughBehavior: never
                requestTemplates:
                  application/json: |
                    {
                      "TableName": "Orders",
                      "KeyConditionExpression": "orderId = :o",
                      "ExpressionAttributeValues": {
                        ":o": {"S": "$util.escapeJavaScript($input.params('orderId'))"}
                      }
                    }
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: |
                        #set($inputRoot = $input.path('$'))
                        #if($inputRoot.Count == 0)
                        #set($context.responseOverride.status = 404)
                        {"message": "Order not found"}
                        #else
                        {
                          "orderId": "$inputRoot.Items[0].orderId.S",
                          "customerId": "$inputRoot.Items[0].customerId.S",
                          "createdAt": "$inputRoot.Items[0].createdAt.S",
                          "items": [
                        #foreach($item in $inputRoot.Items)
                            {"itemId": "$item.itemId.S", "productId": "$item.productId.S", "quantity": $item.quantity.N, "price": $item.price.N}#if($foreach.hasNext),#end
                        #end
                          ]
                        }
                        #end
      Tags:
        Project: project3-serverless

  OrdersApiWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: project3-orders-api-acl
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: project3OrdersApiAcl
      Rules:
        - Name: RateLimitPerIP
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 100
              EvaluationWindowSec: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: project3RateLimitPerIP
      Tags:
        - Key: Project
          Value: project3-serverless

  OrdersApiWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: OrdersApiprodStage
    Properties:
      ResourceArn: !Join ["", ["arn:aws:apigateway:", !Ref "AWS::Region", "::/restapis/", !Ref OrdersApi, "/stages/prod"]]
      WebACLArn: !GetAtt OrdersApiWebAcl.Arn

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: project3-create-order
      Description: Saves a new order to the Orders table
      CodeUri: src/create-order/
      Handler: index.handler
      Tracing: Active
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable
      Events:
        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path: /orders
            Method: post

  OrdersDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: project3-orders-dashboard
      DashboardBody: !Join
        - ""
        - - '{"widgets":['
          - '{"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"API Gateway - Requests and 4XX Errors","region":"'
          - !Ref "AWS::Region"
          - '","stat":"Sum","period":60,"view":"timeSeries","metrics":[["AWS/ApiGateway","Count","ApiName","project3-orders-api"],["AWS/ApiGateway","4XXError","ApiName","project3-orders-api"]]}},'
          - '{"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Lambda - Invocations and Errors","region":"'
          - !Ref "AWS::Region"
          - '","stat":"Sum","period":60,"view":"timeSeries","metrics":[["AWS/Lambda","Invocations","FunctionName","'
          - !Ref CreateOrderFunction
          - '"],["AWS/Lambda","Errors","FunctionName","'
          - !Ref CreateOrderFunction
          - '"]]}}'
          - ']}'

Outputs:
  OrdersTableName:
    Value: !Ref OrdersTable
  OrdersTableArn:
    Value: !GetAtt OrdersTable.Arn
  CreateOrderFunctionArn:
    Value: !GetAtt CreateOrderFunction.Arn
  CreateOrderFunctionRoleArn:
    Value: !GetAtt CreateOrderFunctionRole.Arn
  OrdersApiUrl:
    Description: POST orders to this URL
    Value: !Join ["", ["https://", !Ref OrdersApi, ".execute-api.", !Ref "AWS::Region", ".amazonaws.com/prod/orders"]]
  UserPoolId:
    Value: !Ref OrdersUserPool
  UserPoolClientId:
    Value: !Ref OrdersUserPoolClient
  WebAclArn:
    Value: !GetAtt OrdersApiWebAcl.Arn
  DashboardUrl:
    Description: Open this to see the dashboard
    Value: !Join ["", ["https://", !Ref "AWS::Region", ".console.aws.amazon.com/cloudwatch/home?region=", !Ref "AWS::Region", "#dashboards:name=project3-orders-dashboard"]]
